<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="frame">
      <div class="mat">
        <div class="art" role="img" aria-label="Blurred artwork">
          <div class="painting"></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="time">25:00</div>
      <div class="buttons">
        <button class="btn primary" type="button">Start</button>
        <button class="btn" type="button">Reset</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>

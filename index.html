<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="frame">
      <div class="mat">
        <div class="art" role="img" aria-label="Artwork">
          <div class="painting" id="painting"></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="timebox">
        <div class="time" id="time">25:00</div>
        <div class="buttons">
          <button class="btn primary" id="main-btn" type="button">Start</button>
          <button class="btn" id="reset-btn" type="button">Reset</button>
          <button class="btn primary" id="restart-btn" type="button" hidden>Restart session</button>
        </div>
      </div>
      <div class="details" id="details" hidden>
        <h3>Painting name</h3>
        <p>Artist name</p>
        <p>Year</p>
        <a href="https://www.metmuseum.org/" target="_blank" rel="noopener noreferrer">Read about this painting</a>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
